<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Brand Items - Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f1e8;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111;
        }

        .login-container input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        .login-container input:focus {
            border-color: #b08d57;
        }

        .login-container button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #b08d57;
        }

        .login-container p {
            text-align: center;
            margin-top: 20px;
        }

        .login-container a {
            color: #b08d57;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555 !important;
            font-weight: normal !important;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>BRAND ITEMS</h2>

        <p>আপনার Account-এ Login করুন</p>

        <form>

            <input
                type="email"
                id="loginEmail"
                placeholder="আপনার Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="আপনার Password"
                required
            >

            <button
                type="button"
                onclick="loginUser()"
            >
                Login
            </button>

        </form>

        <p>
            Account নেই?
            <a href="register.html">
                Register করুন
            </a>
        </p>

        <a
            href="index.html"
            class="back-home"
        >
            ← Website-এ ফিরে যান
        </a>

    </div>


    <!-- Firebase Login -->
    <script
        type="module"
        src="auth.js"
    ></script>

</body>

</html>
